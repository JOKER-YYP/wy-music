<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self' 'unsafe-inline' data: blob: http: https: wy-local:;"
    />
    <title>WY Music</title>
    <style>
      html,
      body {
        margin: 0;
        width: 100%;
        height: 100%;
        overflow: hidden;
        background: #1a1a1a;
        user-select: none;
      }
      #cover {
        width: 100%;
        height: 100%;
        background: #1a1a1a center / cover no-repeat;
      }
      #empty {
        position: absolute;
        inset: 0;
        display: none;
        align-items: center;
        justify-content: center;
        color: rgba(255, 255, 255, 0.9);
        font: 600 18px/1.2 'Segoe UI', 'Microsoft YaHei', sans-serif;
        letter-spacing: 0.04em;
        background: linear-gradient(135deg, #ec4141, #ff8a80);
      }
      body.empty #empty {
        display: flex;
      }
    </style>
  </head>
  <body class="empty">
    <div id="cover"></div>
    <div id="empty">WY Music</div>
    <script>
      const cover = document.getElementById('cover')
      const empty = document.getElementById('empty')
      let lastCoverUrl = ''

      function absUrl(u) {
        if (!u) return ''
        if (/^(https?:|data:|blob:|file:|wy-local:)/i.test(u)) return u
        if (u.startsWith('/')) return 'http://127.0.0.1:3001' + u
        return 'http://127.0.0.1:3001/media/' + String(u).replace(/^\/+/, '')
      }

      function apply(state) {
        const url = absUrl(state && state.coverUrl)
        const has = Boolean(state && state.hasTrack)
        if (!has) {
          document.body.classList.add('empty')
          cover.style.backgroundImage = ''
          lastCoverUrl = ''
          empty.textContent = 'WY Music'
          return
        }
        document.body.classList.remove('empty')
        if (!url) {
          // 有曲目但暂无封面：保留上一张，避免点喜欢时闪白
          if (!lastCoverUrl) {
            document.body.classList.add('empty')
            empty.textContent = (state.name || 'WY Music').slice(0, 12)
          }
          return
        }
        if (url === lastCoverUrl) return
        // 已用 data URL 展示时，忽略同曲的 http 回退，防止闪白
        if (lastCoverUrl.startsWith('data:') && !url.startsWith('data:')) return
        lastCoverUrl = url
        cover.style.backgroundImage =
          'url("' + url.replace(/\\/g, '\\\\').replace(/"/g, '\\"') + '")'
      }

      if (window.wyAPI && window.wyAPI.onPlayerState) {
        window.wyAPI.onPlayerState(apply)
      }
      document.addEventListener('dblclick', () => {
        window.wyAPI &&
          window.wyAPI.sendPlayerCommand &&
          window.wyAPI.sendPlayerCommand({ type: 'openMain' })
      })
    </script>
  </body>
</html>
